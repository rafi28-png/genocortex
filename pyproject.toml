[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genocortex"
version = "0.1.0"
description = "Fractal Predictive Cortex - a training-free, alignment-free self-organising brain for biological sequences"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GenoCortex" }]
keywords = ["bioinformatics", "alignment-free", "chaos-game-representation",
            "predictive-coding", "self-organising", "sequence-analysis"]

# The CORE engine needs only these two. Everything else is optional.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["plotly>=5.18"]
bench = ["scikit-learn>=1.3", "matplotlib>=3.7", "dendropy>=5.0"]
test = ["pytest>=7.0"]
all = ["plotly>=5.18", "scikit-learn>=1.3", "matplotlib>=3.7", "dendropy>=5.0", "pytest>=7.0"]

[tool.setuptools]
packages = ["fpc", "viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
