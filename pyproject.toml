[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genocortex"
version = "1.0.0"
description = "GenoCortex: the Fractal Predictive Cortex — a training-free, alignment-free, self-organising model unifying prediction, genomic island detection, classification, and phylogenetics for biological sequences"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Md Rafiur Rahman", email = "rafiur2810@gmail.com" }]
keywords = [
    "bioinformatics",
    "genomics",
    "alignment-free",
    "chaos-game-representation",
    "predictive-coding",
    "horizontal-gene-transfer",
    "phylogenetics",
    "sequence-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# The CORE engine needs only NumPy and SciPy. Everything else is optional.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://rafi28-png.github.io/genocortex/"
Repository = "https://github.com/rafi28-png/genocortex"
Issues = "https://github.com/rafi28-png/genocortex/issues"

[project.scripts]
genocortex = "fpc.cli:main"

[project.optional-dependencies]
viz = ["plotly>=5.18"]
bench = ["scikit-learn>=1.3", "matplotlib>=3.7", "dendropy>=5.0"]
test = ["pytest>=7.0"]
all = ["plotly>=5.18", "scikit-learn>=1.3", "matplotlib>=3.7", "dendropy>=5.0", "pytest>=7.0", "markdown>=3.4"]

[tool.setuptools]
packages = ["fpc", "viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
